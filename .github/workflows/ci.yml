name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.0"

jobs:
  node-runtime:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22", "24", "26"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun ${{ env.BUN_VERSION }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies with Bun
        run: bun install --frozen-lockfile

      - name: Type check and build
        run: bun run build

      - name: Verify package consumer imports
        run: bun run test:consumer

      - name: Run canonical test suite on Node.js ${{ matrix.node-version }}
        run: bun run test

  bun-runtime:
    name: Bun 1.4 runtime
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Setup Bun ${{ env.BUN_VERSION }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies with Bun
        run: bun install --frozen-lockfile

      - name: Verify Bun runtime and secure image adapter
        run: bun run test:bun-runtime

      - name: Verify packed package with Bun
        run: bun run test:package-manager -- bun

  quality:
    name: Lint, browser bundle, package managers
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Setup Bun ${{ env.BUN_VERSION }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: "10.33.0"

      - name: Install dependencies with Bun
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Verify Next.js client bundle
        run: bun run test:browser-bundle

      - name: Verify pnpm and Bun consumers
        run: bun run test:package-managers
